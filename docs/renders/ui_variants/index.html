<!doctype html>
<meta charset="utf-8">
<title>Monster screen — 10 colour variants</title>
<style>
  @font-face { font-family: Jersey10; src: url(Jersey10-Regular.ttf); }
  body { margin: 0; background: #0b1a22; font-family: Jersey10, sans-serif; color: #dbe9ef; }
  h1 { font-weight: 400; font-size: 26px; margin: 18px 24px 4px; }
  p.sub { margin: 0 24px 16px; opacity: .7; font-size: 17px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 22px; padding: 0 24px 40px; }
  .label { font-size: 20px; margin: 0 0 6px; display: flex; justify-content: space-between; }
  .label small { opacity: .65; font-size: 15px; }
  .shot { width: 466px; height: 215px; position: relative; overflow: hidden; }
  .screen { width: 932px; height: 430px; position: absolute; left: 0; top: 0; transform: scale(.5); transform-origin: 0 0; }
  /* the menu wall */
  .screen { background: var(--wall); padding: 4px; box-sizing: border-box; }
  .page { position: relative; width: 100%; height: 100%; background: var(--paper); box-shadow: 0 0 0 2px var(--line); box-sizing: border-box; padding: 12px 14px; color: var(--ink); }
  .title { display: flex; align-items: center; height: 42px; border-bottom: 2px solid var(--rule); }
  .title b { font-weight: 400; font-size: 30px; flex: 1; }
  .chip { background: var(--panel); padding: 4px 12px; font-size: 20px; margin-right: 12px; box-shadow: 0 0 0 2px var(--line); }
  .close { width: 36px; height: 36px; background: var(--accent); box-shadow: 0 0 0 2px var(--line), 2px 3px 0 2px var(--accent2); display: grid; place-items: center; font-size: 26px; color: var(--onaccent); }
  .tools { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .tool { width: 43px; height: 36px; background: var(--tile); box-shadow: 0 0 0 2px var(--line), 0 3px 0 2px var(--shadow); display: grid; place-items: center; font-size: 22px; }
  .tools span { font-size: 22px; margin-left: 8px; opacity: .8; }
  .card { position: absolute; left: 14px; top: 140px; width: 104px; height: 138px; background: url(card.png) center/cover; box-shadow: 0 0 0 2px var(--line), 0 3px 0 2px var(--shadow); }
  .side { position: absolute; right: 14px; top: 62px; width: 130px; bottom: 14px; background: var(--panel); box-shadow: 0 0 0 2px var(--line); padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
  .row { flex: 1; background: var(--tile); box-shadow: 0 0 0 2px var(--line), 0 3px 0 2px var(--shadow); display: flex; align-items: center; gap: 8px; padding: 0 8px; }
  .row i { width: 28px; height: 28px; background: var(--accent); display: block; box-shadow: 0 3px 0 var(--accent2); }
  .row b { font-weight: 400; font-size: 22px; line-height: 1; display: block; }
  .row s { text-decoration: none; font-size: 17px; opacity: .75; display: block; }
  .bar { height: 8px; background: var(--rule); margin-top: 4px; }
  .bar u { display: block; height: 100%; width: 6%; background: var(--accent); }
  .btn { position: absolute; left: 14px; bottom: 14px; padding: 6px 16px; background: var(--accent); color: var(--onaccent); font-size: 22px; box-shadow: 0 0 0 2px var(--line), 0 3px 0 2px var(--accent2); }
  .hint { position: absolute; left: 140px; top: 160px; font-size: 22px; opacity: .85; width: 520px; }
  .hint em { font-style: normal; color: var(--head); }
</style>
<h1>Monsterscreen, 10 Farbvarianten</h1>
<p class="sub">Alle mit dem gleichen Blau als Header und Wand. Verändert wird nur die Fläche (Karten, Panels), die Schrift und der Akzent.</p>
<div class="grid" id="g"></div>
<script>
const V = [
 ['1  Schiefer', 'kühles Blaugrau, Orange', {wall:'#2E7285', paper:'#C9D9E2', panel:'#B6CBD7', tile:'#DCE8EE', ink:'#13293A', head:'#1E6F8E', accent:'#FF9F3A', accent2:'#C76A12', onaccent:'#13293A'}],
 ['2  Sand', 'warmes Beige, Blau-Akzent', {wall:'#2E7285', paper:'#E3D5B8', panel:'#D2C29F', tile:'#EFE5CC', ink:'#2B2214', head:'#1E6F8E', accent:'#1E6F8E', accent2:'#0F3A4D', onaccent:'#FFFFFF'}],
 ['3  Nacht', 'dunkle Karten, helle Schrift', {wall:'#12313C', paper:'#1F4E63', panel:'#25596B', tile:'#2C6A80', ink:'#EAF4F8', head:'#7FD6E8', accent:'#FF9F3A', accent2:'#C76A12', onaccent:'#13293A'}],
 ['4  Mint', 'frisches Grün, Koralle', {wall:'#1E6F5F', paper:'#CDEBDD', panel:'#B5DDCB', tile:'#E3F4EB', ink:'#12332B', head:'#17695A', accent:'#FF8A5C', accent2:'#C25528', onaccent:'#2B1209'}],
 ['5  Dämmerung', 'Violettgrau, Gelb', {wall:'#3A3F8A', paper:'#D8D4EA', panel:'#C6C1DE', tile:'#E8E5F4', ink:'#1E1B3A', head:'#4B4FA8', accent:'#FFC631', accent2:'#B88A0C', onaccent:'#1E1B3A'}],
 ['6  Pfirsich', 'warm, Blau-Akzent', {wall:'#2E7285', paper:'#FBD9C4', panel:'#F2C3A8', tile:'#FDE8DA', ink:'#3A1D14', head:'#B4421C', accent:'#1E6F8E', accent2:'#0F3A4D', onaccent:'#FFFFFF'}],
 ['7  Eis', 'helles Türkis, Orange', {wall:'#1E6F8E', paper:'#BFE6EE', panel:'#A5D8E4', tile:'#D7F0F5', ink:'#0E3040', head:'#14607E', accent:'#FF9F3A', accent2:'#C76A12', onaccent:'#0E3040'}],
 ['8  Tiefsee', 'Marine mit Cyan', {wall:'#0E2530', paper:'#17384A', panel:'#1E4A60', tile:'#256078', ink:'#E6F4F8', head:'#5FE0E0', accent:'#3FD0D0', accent2:'#1C8C8C', onaccent:'#08222B'}],
 ['9  Stein', 'neutrales Grau, Orange', {wall:'#2B3A44', paper:'#D5D9DC', panel:'#C0C6CA', tile:'#E6E9EB', ink:'#1A2228', head:'#2E5A70', accent:'#FF9F3A', accent2:'#C76A12', onaccent:'#1A2228'}],
 ['10  Butter', 'sanftes Gelb, Blau', {wall:'#1E6F8E', paper:'#F6E7A8', panel:'#EBD68A', tile:'#FBF1C8', ink:'#2E2610', head:'#14607E', accent:'#2E7285', accent2:'#124759', onaccent:'#FFFFFF'}],
];
const g = document.getElementById('g');
for (const [name, note, c] of V) {
  const d = document.createElement('div');
  const dark = parseInt(c.paper.slice(1,3),16) < 0x50;
  const vars = `--wall:${c.wall};--paper:${c.paper};--panel:${c.panel};--tile:${c.tile};--ink:${c.ink};--head:${c.head};--accent:${c.accent};--accent2:${c.accent2};--onaccent:${c.onaccent};--line:${dark?'#06161d':'#0B1E27'};--rule:${dark?'#3A7A92':'rgba(19,41,58,.28)'};--shadow:${dark?'#0a2029':'rgba(11,30,39,.55)'}`;
  d.innerHTML = `<p class="label">${name}<small>${note}</small></p>
  <div class="shot"><div class="screen" style="${vars}"><div class="page">
    <div class="title"><b>Monsters</b><span class="chip">1 · housing 1/5</span><span class="close">×</span></div>
    <div class="tools"><div class="tool">⌕</div><div class="tool">▼</div><div class="tool">⇅</div><span>Newest</span></div>
    <div class="card"></div>
    <div class="hint"><em>Tipp:</em> Dein erstes Monster wartet auf seinen Einsatz. Stelle ein Team zusammen.</div>
    <div class="side">
      <div class="row"><i></i><div><b>Teams</b><s>No team yet</s></div></div>
      <div class="row"><i></i><div><b>Breeding</b><s>0/0</s></div></div>
      <div class="row"><i></i><div><b>Bestiary</b><s>1%</s><div class="bar"><u></u></div></div></div>
    </div>
    <div class="btn">New team</div>
  </div></div></div>`;
  g.appendChild(d);
}
</script>
