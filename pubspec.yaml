name: boddygame
description: "Bøddy settlement & creature game — split out of the BoddyQuest fitness app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  # The store cached_network_image already writes to, named directly so the
  # background art warm-up can pull BYTES without decoding a picture
  # (settlement_screen._warmNetworkArtInBackground). Precaching through
  # ImageProviders decoded ~300 pictures nothing ever read and evicted the
  # ones the map was drawing.
  flutter_cache_manager: ^3.4.0
  file_picker: ^11.0.2
  pedometer: ^4.2.0
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  # Pulls the player back when an offline timer lands — expeditions, caravans,
  # breeding, hatching, crafting, healing and construction all finish while the
  # app is closed, and until now nothing said so (user 2026-07-30).
  flutter_local_notifications: ^19.4.2
  # zonedSchedule() works in a named zone, so the reminder has to be built in the
  # DEVICE's zone — otherwise a 2 h trip fires at the right instant on Android and
  # at the wrong wall-clock time on iOS.
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  # Sound effects (user 2026-07-30). Kept behind Feel.soundOn so a player who
  # wants silence gets it, and every clip is a small generated WAV in
  # assets/sfx/ — see core/ui/feel.dart.
  audioplayers: ^6.5.1
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Listed file by file (2026-09-20): a bare `assets/images/` entry ships
    # everything directly inside that folder. The retired 48 MB baked
    # map_background.png that made that matter is gone from the repo now
    # (2026-09-21) — TerrainLayer replaced it long ago — but the explicit
    # list stays, because it is what keeps a stray file from silently
    # shipping again. tile_active/tile_inactive went the same way: the two
    # FoE constants naming them were the only mention left anywhere.
    - assets/images/overworld_grass.png
    # Its own line, because a directory entry is NOT recursive — the sixteen
    # road tiles would simply not ship.
    - assets/images/roads/
    - assets/images/buildings/
    # Baked, animated 3D monsters (tool/blender/monster_anim_pro.py): one folder
    # per species, WebP sheets played by creatures/widgets/monster_sheet.dart.
    - assets/images/monsters/tidelord/
    - assets/images/monsters/tidelord_s1/
    - assets/images/monsters/tidelord_s2/
    - assets/images/terrain/
    - assets/sfx/
    - assets/music/
    # Outfit, the app's one typeface, bundled so google_fonts finds it in the
    # asset manifest instead of downloading it on first launch (2026-09-20) —
    # text used to render in the fallback face until the fetch finished, and
    # not at all offline on a fresh install. Only the weights the app asks
    # for; the licence (SIL OFL) travels with them.
    - assets/fonts/
  # The app's one face (Jersey 10, SIL OFL): a pixel font cut for small sizes.
  # The one Regular file is registered for EVERY weight on purpose: a pixel
  # font has no bold, and without these entries Flutter would smear a fake one
  # over it wherever the code asks for w700/w800.
  fonts:
    - family: Jersey10
      fonts:
        - asset: assets/fonts/Jersey10-Regular.ttf
          weight: 400
        - asset: assets/fonts/Jersey10-Regular.ttf
          weight: 500
        - asset: assets/fonts/Jersey10-Regular.ttf
          weight: 600
        - asset: assets/fonts/Jersey10-Regular.ttf
          weight: 700
        - asset: assets/fonts/Jersey10-Regular.ttf
          weight: 800
        - asset: assets/fonts/Jersey10-Regular.ttf
          weight: 900
